server {
    listen 80;
    server_name test.gify.geekyous.cn test.api.gify.geekyous.cn;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name test.api.gify.geekyous.cn;

    ssl_certificate     /etc/letsencrypt/live/test.gify.geekyous.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.gify.geekyous.cn/privkey.pem;

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 流式对话必需
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name test.gify.geekyous.cn;

    ssl_certificate     /etc/letsencrypt/live/test.gify.geekyous.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.gify.geekyous.cn/privkey.pem;

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

