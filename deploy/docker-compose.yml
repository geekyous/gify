services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: .env
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gify}
      POSTGRES_DB: ${POSTGRES_DB:-gify}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gify}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:

