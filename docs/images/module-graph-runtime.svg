<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-label="运行时调用图：chat 执行一轮对话交给 engine；engine 读取 agents 的配置并分流、检索知识库、调用模型服务、执行工具调用、向 usage 记录用量与轨迹。">
  <style>
    .n { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; font-weight: 600; fill: #1B1E23; }
    .tag { font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; font-size: 11px; fill: #4A4F57; }
    .el { font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; font-size: 11.5px; fill: #4A4F57; }
    .box { fill: #FFFFFF; stroke: #D9D7D0; stroke-width: 1.25; }
    .box-engine { fill: #FFFFFF; stroke: #2E5AAC; stroke-width: 1.8; }
    .edge { fill: none; stroke: #565D68; stroke-width: 1.4; }
  </style>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#565D68"/>
    </marker>
  </defs>

  <!-- chat → engine -->
  <rect class="box" x="440" y="40" width="120" height="46" rx="8"/>
  <text class="n" x="500" y="59" text-anchor="middle">chat</text>
  <text class="tag" x="500" y="76" text-anchor="middle">对话与分享</text>
  <path class="edge" d="M 500,86 L 500,134" marker-end="url(#arr)"/>
  <text class="el" x="512" y="115">执行一轮对话</text>

  <!-- engine -->
  <rect class="box box-engine" x="440" y="140" width="120" height="46" rx="8"/>
  <text class="n" x="500" y="159" text-anchor="middle">engine</text>
  <text class="tag" x="500" y="176" text-anchor="middle">对话引擎</text>

  <!-- 公共引出横线 -->
  <path class="edge" d="M 500,186 L 500,216 M 145,216 L 855,216"/>

  <!-- 五路下行 -->
  <path class="edge" d="M 205,216 L 205,272" marker-end="url(#arr)"/>
  <text class="el" x="197" y="248" text-anchor="end">读取配置与分流</text>
  <path class="edge" d="M 375,216 L 375,272" marker-end="url(#arr)"/>
  <text class="el" x="367" y="248" text-anchor="end">检索知识库</text>
  <path class="edge" d="M 545,216 L 545,272" marker-end="url(#arr)"/>
  <text class="el" x="537" y="248" text-anchor="end">调用模型服务</text>
  <path class="edge" d="M 715,216 L 715,272" marker-end="url(#arr)"/>
  <text class="el" x="707" y="248" text-anchor="end">执行工具调用</text>
  <path class="edge" d="M 855,216 L 855,272" marker-end="url(#arr)"/>
  <text class="el" x="847" y="248" text-anchor="end">记录用量与轨迹</text>

  <!-- 目标行 -->
  <rect class="box" x="145" y="280" width="120" height="46" rx="8"/>
  <text class="n" x="205" y="299" text-anchor="middle">agents</text>
  <text class="tag" x="205" y="316" text-anchor="middle">Agent 配置</text>
  <rect class="box" x="315" y="280" width="120" height="46" rx="8"/>
  <text class="n" x="375" y="299" text-anchor="middle">kb</text>
  <text class="tag" x="375" y="316" text-anchor="middle">知识库</text>
  <rect class="box" x="485" y="280" width="120" height="46" rx="8"/>
  <text class="n" x="545" y="299" text-anchor="middle">providers</text>
  <text class="tag" x="545" y="316" text-anchor="middle">模型接入</text>
  <rect class="box" x="655" y="280" width="120" height="46" rx="8"/>
  <text class="n" x="715" y="299" text-anchor="middle">tools</text>
  <text class="tag" x="715" y="316" text-anchor="middle">工具接入</text>
  <rect class="box" x="795" y="280" width="120" height="46" rx="8"/>
  <text class="n" x="855" y="299" text-anchor="middle">usage</text>
  <text class="tag" x="855" y="316" text-anchor="middle">用量与日志</text>
</svg>
