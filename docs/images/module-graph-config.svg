<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-label="配置与查询图：chat 校验会话归属依赖 agents；agents 保存配置时校验挂载的知识库、所选模型、勾选的工具；kb 建库时锁定嵌入模型依赖 providers；usage 按 Agent 归属过滤、查询用户名依赖 identity。">
  <style>
    .n { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; font-weight: 600; fill: #1B1E23; }
    .tag { font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; font-size: 11px; fill: #4A4F57; }
    .el { font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; font-size: 11.5px; fill: #4A4F57; }
    .box { fill: #FFFFFF; stroke: #D9D7D0; stroke-width: 1.25; }
    .edge { fill: none; stroke: #565D68; stroke-width: 1.4; }
  </style>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#565D68"/>
    </marker>
  </defs>

  <!-- 顶行：chat → agents -->
  <rect class="box" x="140" y="100" width="120" height="46" rx="8"/>
  <text class="n" x="200" y="119" text-anchor="middle">chat</text>
  <text class="tag" x="200" y="136" text-anchor="middle">对话与分享</text>
  <rect class="box" x="460" y="100" width="120" height="46" rx="8"/>
  <text class="n" x="520" y="119" text-anchor="middle">agents</text>
  <text class="tag" x="520" y="136" text-anchor="middle">Agent 配置</text>
  <path class="edge" d="M 260,123 L 454,123" marker-end="url(#arr)"/>
  <text class="el" x="357" y="112" text-anchor="middle">校验会话归属</text>

  <!-- agents → kb / providers / tools -->
  <path class="edge" d="M 465,146 L 465,195 L 250,195 L 250,226" marker-end="url(#arr)"/>
  <text class="el" x="352" y="186" text-anchor="middle">校验挂载的知识库</text>
  <path class="edge" d="M 505,146 L 505,226" marker-end="url(#arr)"/>
  <text class="el" x="515" y="212">校验所选模型</text>
  <path class="edge" d="M 545,146 L 545,195 L 760,195 L 760,226" marker-end="url(#arr)"/>
  <text class="el" x="655" y="186" text-anchor="middle">校验勾选的工具</text>

  <!-- 中行：kb / providers / tools -->
  <rect class="box" x="190" y="230" width="120" height="46" rx="8"/>
  <text class="n" x="250" y="249" text-anchor="middle">kb</text>
  <text class="tag" x="250" y="266" text-anchor="middle">知识库</text>
  <rect class="box" x="460" y="230" width="120" height="46" rx="8"/>
  <text class="n" x="520" y="249" text-anchor="middle">providers</text>
  <text class="tag" x="520" y="266" text-anchor="middle">模型接入</text>
  <rect class="box" x="700" y="230" width="120" height="46" rx="8"/>
  <text class="n" x="760" y="249" text-anchor="middle">tools</text>
  <text class="tag" x="760" y="266" text-anchor="middle">工具接入</text>

  <!-- kb → providers（同层相邻） -->
  <path class="edge" d="M 310,253 L 454,253" marker-end="url(#arr)"/>
  <text class="el" x="382" y="243" text-anchor="middle">锁定嵌入模型</text>

  <!-- usage → agents（绕右侧进入 agents 右沿） -->
  <path class="edge" d="M 820,383 L 860,383 L 860,123 L 584,123" marker-end="url(#arr)"/>
  <text class="el" x="722" y="112" text-anchor="middle">按 Agent 归属过滤</text>

  <!-- usage / identity -->
  <rect class="box" x="700" y="360" width="120" height="46" rx="8"/>
  <text class="n" x="760" y="379" text-anchor="middle">usage</text>
  <text class="tag" x="760" y="396" text-anchor="middle">用量与日志</text>
  <rect class="box" x="700" y="480" width="120" height="46" rx="8"/>
  <text class="n" x="760" y="499" text-anchor="middle">identity</text>
  <text class="tag" x="760" y="516" text-anchor="middle">用户与审计</text>
  <path class="edge" d="M 760,406 L 760,476" marker-end="url(#arr)"/>
  <text class="el" x="772" y="446">查询用户名</text>
</svg>
